[package]
name = "poseidon-polkavm"
version = "0.1.2"
edition = "2021"
publish = false

[[bin]]
name = "erc20"
path = "src/erc20.rs"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[dependencies]
polkavm-derive = { version = "0.25.0" }
simplealloc = { version = "0.0.1", git = "https://github.com/paritytech/polkavm.git" }
ethabi = { version = "18.0", default-features = false }
ark-ff = "0.5.0"
#light-poseidon = "0.3.0"

#fastcrypto-zkp = "0.1.3"
#ff = {package="ff_ce" , version="0.11", default-features = false}

#poseidon-rs = { git="https://github.com/arnaucube/poseidon-rs" }

[dependencies.uapi]
package = "pallet-revive-uapi"
git = "https://github.com/paritytech/polkadot-sdk.git"
default-features = false
features = ["unstable-hostfn"]
