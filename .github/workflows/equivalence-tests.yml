name: Equivalence Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nargo
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: 1.0.0-beta.5

      - name: Install bb
        run: |
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/master/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          "$HOME/.bb/bbup" --version 0.84.0

      - name: Install Foundry (forge, cast, anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust nightly-2026-04-20 (pinned, see rust-toolchain.toml)
        run: rustup toolchain install nightly-2026-04-20 --component rust-src --profile minimal

      - name: Cache polkatool
        id: cache-polkatool
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/polkatool
          key: polkatool-0.25.0-${{ runner.os }}

      - name: Install polkatool
        if: steps.cache-polkatool.outputs.cache-hit != 'true'
        run: cargo install polkatool --version 0.25.0 --locked

      - name: Cache local PVM devnet binaries
        id: cache-devnet
        uses: actions/cache@v4
        with:
          path: |
            test/equivalence/bin/dev-node
            test/equivalence/bin/eth-rpc
          # Bump this key if bin/setup-dev-node.sh's TAG changes.
          key: pvm-devnet-nodes-19907546951-linux-x64

      - name: Download local PVM devnet binaries
        if: steps.cache-devnet.outputs.cache-hit != 'true'
        run: ./test/equivalence/bin/setup-dev-node.sh

      - name: Install generator dependencies
        run: cd generator && npm install

      - name: Start local devnets
        run: |
          chmod +x test/equivalence/bin/dev-node test/equivalence/bin/eth-rpc

          wait_for_rpc() {
            local url="$1" name="$2" logs="$3"
            for i in $(seq 1 60); do
              if curl -sf -X POST "$url" -H "Content-Type: application/json" \
                   -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' >/dev/null 2>&1; then
                echo "$name ready after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "$name did not become ready within 60s"
            cat $logs
            exit 1
          }

          ./test/equivalence/bin/dev-node --dev --rpc-port 8001 > /tmp/dev-node.log 2>&1 &
          ./test/equivalence/bin/eth-rpc --dev --node-rpc-url=ws://127.0.0.1:8001 --rpc-port 8546 > /tmp/eth-rpc.log 2>&1 &
          anvil --port 8547 > /tmp/anvil.log 2>&1 &

          # dev-node's own RPC comes up in ~8s locally, then eth-rpc needs
          # further time to connect to it before eth-rpc's own RPC is ready -
          # a fixed sleep undercounts this on a colder/busier runner, so poll
          # instead of guessing a duration.
          wait_for_rpc http://127.0.0.1:8546 "PVM devnet (dev-node/eth-rpc)" "/tmp/dev-node.log /tmp/eth-rpc.log"
          wait_for_rpc http://127.0.0.1:8547 "EVM devnet (anvil)" "/tmp/anvil.log"

      - name: Generate proof artifacts for every circuit shape
        run: |
          for dir in fixtures/noir-circuit fixtures/zero-pub-input fixtures/multi-pub-input fixtures/large-circuit fixtures/huge-pub-input fixtures/huge-circuit fixtures/zkemail; do
            (
              cd "$dir"
              nargo execute
              # find, not a flat glob: fixtures/zkemail's package name
              # ("zkemail/twitter@v1") makes nargo nest output one level
              # deeper (target/zkemail/twitter@v1.json) instead of flat.
              BYTECODE=$(find target -name '*.json')
              WITNESS=$(find target -name '*.gz')
              bb prove --bytecode_path "$BYTECODE" --witness_path "$WITNESS" --output_path ./target --oracle_hash keccak
              bb write_vk --bytecode_path "$BYTECODE" --output_path ./target --oracle_hash keccak
              bb write_solidity_verifier --vk_path ./target/vk --output_path ./target/HonkVerifier.sol
            )
          done

      - name: Run equivalence tests across the circuit-shape matrix
        run: |
          set -e
          for dir in fixtures/noir-circuit fixtures/zero-pub-input fixtures/multi-pub-input fixtures/large-circuit fixtures/huge-pub-input fixtures/huge-circuit fixtures/zkemail; do
            echo "::group::$dir"
            ./test/equivalence/run.sh "$(pwd)/$dir"
            echo "::endgroup::"
          done
